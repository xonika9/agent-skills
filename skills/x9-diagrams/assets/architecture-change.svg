<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="architecture-change-title architecture-change-desc" role="img" viewBox="0 0 960 640"><title id="architecture-change-title">Order processing before and after adding a queue</title><desc id="architecture-change-desc">A fictional order API enqueues jobs instead of dispatching them directly. The same worker changes from inline to queued processing; the request path and logical component positions remain stable.</desc><style>.paper{fill:#fff}.mask,.panel{fill:#f8fafc}.panel{stroke:#d8dee8;stroke-width:1}.edge,.focus,.node{stroke-width:1.5}.node{fill:#fff;stroke:#526075}.focus{fill:#fff4ed;stroke:#9a3412}.edge{fill:none;stroke:#526075}.detail,.name{font-family:system-ui,sans-serif}.name{fill:#172033;font-size:14px;font-weight:600}.detail,.token{fill:#526075;font-size:12px}.token{font-family:ui-monospace,monospace}.heading{fill:#172033;font-family:system-ui,sans-serif;font-size:16px;font-weight:600}</style><defs><marker id="architecture-change-arrow" markerHeight="6" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="8" refY="3"><path fill="#526075" d="M 0 0 L 8 3 L 0 6 Z"/></marker></defs><rect width="960" height="640" class="paper"/><text x="40" y="36" class="heading">Order processing: adding a durable queue</text><g data-layer="boundaries"><g data-boundary="before"><rect width="248" height="492" x="40" y="76" class="panel" rx="6"/><text x="64" y="106" class="heading">Before</text></g><g data-boundary="after"><rect width="248" height="492" x="672" y="76" class="panel" rx="6"/><text x="696" y="106" class="heading">After</text></g></g><g data-layer="edges"><g data-edge="before-r1" data-from="before-client" data-to="before-api"><path marker-end="url(#architecture-change-arrow)" d="M 164 188 V 248" class="edge"/></g><g data-edge="before-r2" data-from="before-api" data-to="before-worker"><path marker-end="url(#architecture-change-arrow)" d="M 164 308 V 488" class="edge"/></g><g data-edge="after-r1" data-from="after-client" data-to="after-api"><path marker-end="url(#architecture-change-arrow)" d="M 796 188 V 248" class="edge"/></g><g data-edge="after-r2" data-from="after-api" data-to="after-queue"><path marker-end="url(#architecture-change-arrow)" d="M 796 308 V 368" class="edge"/></g><g data-edge="after-r3" data-from="after-queue" data-to="after-worker"><path marker-end="url(#architecture-change-arrow)" d="M 796 428 V 488" class="edge"/></g></g><g data-layer="nodes"><g data-node="before-client" data-parent="before"><rect width="200" height="60" x="64" y="128" class="node" rx="5"/><text x="76" y="153" class="name">Client</text><text x="76" y="173" class="token">client · unchanged</text></g><g data-node="before-api" data-parent="before"><rect width="200" height="60" x="64" y="248" class="focus" rx="5"/><text x="76" y="273" class="name">API · changed</text><text x="76" y="293" class="token">api · dispatch</text></g><g data-node="before-worker" data-parent="before"><rect width="200" height="60" x="64" y="488" class="node" rx="5"/><text x="76" y="513" class="name">Worker · changed</text><text x="76" y="533" class="token">worker · inline</text></g><g data-node="after-client" data-parent="after"><rect width="200" height="60" x="696" y="128" class="node" rx="5"/><text x="708" y="153" class="name">Client</text><text x="708" y="173" class="token">client · unchanged</text></g><g data-node="after-api" data-parent="after"><rect width="200" height="60" x="696" y="248" class="focus" rx="5"/><text x="708" y="273" class="name">API · changed</text><text x="708" y="293" class="token">api · enqueue</text></g><g data-node="after-queue" data-parent="after"><rect width="200" height="60" x="696" y="368" class="node" rx="5"/><text x="708" y="393" class="name">+ Durable queue</text><text x="708" y="413" class="token">queue · added</text></g><g data-node="after-worker" data-parent="after"><rect width="200" height="60" x="696" y="488" class="node" rx="5"/><text x="708" y="513" class="name">Worker · changed</text><text x="708" y="533" class="token">worker · queued</text></g></g><g data-layer="labels"><g data-label-for="before-r1"><rect width="84" height="20" x="176" y="208" class="mask"/><text x="182" y="222" class="detail">request</text></g><g data-label-for="before-r2"><rect width="84" height="20" x="176" y="388" class="mask"/><text x="182" y="402" class="detail">dispatch</text></g><g data-label-for="after-r1"><rect width="84" height="20" x="808" y="208" class="mask"/><text x="814" y="222" class="detail">request</text></g><g data-label-for="after-r2"><rect width="84" height="20" x="808" y="328" class="mask"/><text x="814" y="342" class="detail">enqueue</text></g><g data-label-for="after-r3"><rect width="84" height="20" x="808" y="448" class="mask"/><text x="814" y="462" class="detail">deliver</text></g><text x="336" y="106" class="heading">Changes</text><text x="336" y="158" class="name">1. API behavior</text><text x="336" y="182" class="token">api: dispatch → enqueue</text><text x="336" y="234" class="name">2. Worker behavior</text><text x="336" y="258" class="token">worker: inline → queued</text><text x="336" y="310" class="name">3. Added component</text><text x="336" y="334" class="token">+ queue: durable jobs</text><text x="336" y="386" class="name">4. Changed relationship</text><text x="336" y="410" class="token">r2: dispatch → enqueue</text><text x="336" y="432" class="token">api → worker becomes</text><text x="336" y="454" class="token">api → queue</text><text x="336" y="506" class="name">5. Added relationship</text><text x="336" y="530" class="token">+ r3: queue → worker</text><text x="40" y="606" class="detail">Illustrative system · 4 logical components · 7 drawn nodes · 5 drawn relationships</text></g></svg>