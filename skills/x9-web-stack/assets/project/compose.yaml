# Production-shaped stack. Only Caddy publishes ports.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *logging

  # Runs pending migrations once, before the API starts.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["bun", "src/db/migrate.ts"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *logging

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    init: true
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?}
      PORT: "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *logging

  # Serves the client build and proxies /api to the API, with automatic TLS.
  caddy:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    restart: unless-stopped
    logging: *logging

volumes:
  db-data:
  caddy-data:
  caddy-config:
