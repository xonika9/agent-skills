# Local development only: docker compose -f compose.yaml -f compose.dev.yaml up -d db
# Publishes PostgreSQL on loopback for the dev server and tests.
services:
  db:
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./scripts/dev-db-init.sql:/docker-entrypoint-initdb.d/dev-db-init.sql:ro
