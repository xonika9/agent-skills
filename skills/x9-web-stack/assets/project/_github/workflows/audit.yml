# Reports known vulnerabilities. Not a required check: an unfixable advisory in
# a transitive dependency must not block unrelated work.
name: audit

on:
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
    paths: ["bun.lock", "**/package.json"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun ci
      - run: bun audit --audit-level=high --prod
