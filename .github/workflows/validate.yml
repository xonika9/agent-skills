name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  skills:
    name: Skills and public data
    runs-on: ubuntu-latest
    steps:
      - name: Check out the full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Run skill validators
        run: |
          python3 skills/x9-skill-creator/scripts/test_validate.py
          for skill in skills/*; do
            python3 skills/x9-skill-creator/scripts/validate.py \
              --runtime portable --runtime claude --runtime codex "$skill"
          done

      - name: Run deterministic regression tests
        run: |
          python3 skills/x9-agent-instructions/scripts/test_check_globals.py
          python3 skills/x9-diagrams/scripts/test_check_scene.py
          python3 skills/x9-okf-docs/scripts/test_okf.py
          python3 skills/x9-research/scripts/test_validate_html.py

      - name: Check repository instruction import
        run: printf '@AGENTS.md\n' | cmp - CLAUDE.md

      - name: Check plugin package metadata
        run: python3 scripts/check_package.py

      - name: Check public data
        run: python3 scripts/check_public.py

      - name: Check changelog coverage and release metadata
        run: |
          python3 scripts/test_prepare_release.py
          python3 scripts/prepare_release.py --check

      - name: Scan Git history with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
